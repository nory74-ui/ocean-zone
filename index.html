  for (let i = 0; i < N; i++) { pos.set([R(-18, 18), R(-18, 18), R(-18, 18)], i * 3); seed[i] = rand(); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.NormalBlending,
    uniforms: { uTime: T, uScale: pointUniforms.uScale },
    vertexShader: `attribute float aSeed; uniform float uTime, uScale; varying float vA;
      void main(){
        vec3 box = vec3(36.0);
        vec3 p = position + vec3(sin(uTime * 0.1 + aSeed * 6.0) * 0.5 + uTime * 0.09,
                                 -uTime * (0.04 + aSeed * 0.08),
                                 cos(uTime * 0.13 + aSeed * 5.0) * 0.5);
        p = mod(p - cameraPosition + box * 0.5, box) - box * 0.5 + cameraPosition;
        vec4 mv = viewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        float d = max(0.01, -mv.z);
        gl_PointSize = clamp(uScale * (0.008 + aSeed * 0.012) / d, 1.0, 5.5);
        // レンズ直前のボケ白点化を抑えつつ遠近フェード
        vA = smoothstep(18.0, 5.5, length(p - cameraPosition)) * smoothstep(1.2, 2.8, d) * (0.18 + aSeed * 0.34);
      }`,
    fragmentShader: `varying float vA;
      void main(){
        float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard;
        gl_FragColor = vec4(vec3(0.62, 0.80, 0.86), smoothstep(0.5, 0.05, d) * vA);
      }`
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
}

// ---------------------------------------------------------------- build full ecosystem asynchronously
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3();
const dummy = new THREE.Object3D();

class School {
  constructor({ geo, tex, count, scale, scaleVar = 0.25, spec = 0.3, spread, path, speed = 1, wiggle = 9, amp = 0.075, lag = 1.5, wob = 0.35, stationary = false, places = null }) {
    this.mesh = new THREE.InstancedMesh(geo, makeFishMat(tex, spec), count);
    this.mesh.frustumCulled = false;
    this.path = path; this.speed = speed; this.wobAmp = wob; this.stationary = stationary;
    this.fish = [];
    const ph = new Float32Array(count), sp = new Float32Array(count), am = new Float32Array(count), tn = new Float32Array(count);
    const g = () => (rand() + rand() + rand() - 1.5) / 1.5;

    for (let i = 0; i < count; i++) {
      const s = scale * (1 + R(-0.5, 0.5) * scaleVar);
      ph[i] = rand();
      sp[i] = wiggle * R(0.85, 1.2);
      am[i] = stationary ? 0.014 : amp * R(0.85, 1.2);
      tn[i] = R(-1, 1);
      if (stationary && places) {
        const pl = places[i % places.length];
        dummy.position.set(pl.x, pl.y, pl.z);
        dummy.rotation.set(pl.rx || 0, pl.ry || R(0, 6.28), pl.rz || 0);
        dummy.scale.setScalar(s);
        dummy.updateMatrix();
        this.mesh.setMatrixAt(i, dummy.matrix);
        this.fish.push({ staticPos: new THREE.Vector3(pl.x, pl.y, pl.z), s });
      } else {
        this.fish.push({
          off: new THREE.Vector3(g() * spread[0], g() * spread[1], g() * spread[2]),
          lag: R(0, lag), wp: R(0, 6.28), wf: R(0.28, 0.72), s,
          dir: new THREE.Vector3(1, 0, 0),
        });
      }
    }
    geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(ph, 1));
    geo.setAttribute('aSpeed', new THREE.InstancedBufferAttribute(sp, 1));
    geo.setAttribute('aAmp', new THREE.InstancedBufferAttribute(am, 1));
    geo.setAttribute('aTint', new THREE.InstancedBufferAttribute(tn, 1));
    if (stationary) this.mesh.instanceMatrix.needsUpdate = true;
    scene.add(this.mesh);
  }
  pos(f, t, out) {
    this.path(t * this.speed - f.lag, out);
    const br = 1 + 0.16 * Math.sin(t * 0.22 + f.wp);
    out.addScaledVector(f.off, br);
    out.x += Math.sin(t * f.wf + f.wp) * this.wobAmp;
    out.y += Math.sin(t * f.wf * 1.25 + f.wp * 2) * this.wobAmp * 0.45;
    out.z += Math.cos(t * f.wf * 0.9 + f.wp) * this.wobAmp;
    out.y = Math.min(SURF - 1.2, Math.max(out.y, floorH(out.x, out.z) + 0.45 + f.s * 0.4));
    return out;
  }
  update(t) {
    if (this.stationary) return;
    this.fish.forEach((f, i) => {
      this.pos(f, t, tmpA);
      this.pos(f, t + 0.12, tmpB);
      tmpC.subVectors(tmpB, tmpA);
      if (tmpC.lengthSq() > 1e-8) f.dir.lerp(tmpC.normalize(), 0.14).normalize();
      dummy.position.copy(tmpA);
      dummy.lookAt(tmpC.copy(tmpA).add(f.dir));
      dummy.scale.setScalar(f.s);
      dummy.updateMatrix();
      this.mesh.setMatrixAt(i, dummy.matrix);
    });
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  anchor(out) {
    if (this.stationary) return out.copy(this.fish[0].staticPos);
    return this.pos(this.fish[0], T.value, out);
  }
}

function makeSeaweedCard(tex, aspect, count, places, { sway = 0.16, warmBack = [0.22, 0.25, 0.06], tiltStrength = 0.08 }) {
  // 4枚の湾曲・螺旋ねじれ・皺凹凸つき3D葉体クラスタ (平面クロスから立体的藻体へ)
  const sheets = [];
  const wCard = 1 / aspect;
  for (let k = 0; k < 4; k++) {
    const sh = new THREE.PlaneGeometry(wCard, 1, 6, 16);
    sh.translate(0, 0.5, 0);
    const p = sh.attributes.position, uv = sh.attributes.uv;
    const tanArr = new Float32Array(p.count * 3);
    const rotA = k * Math.PI * 0.25 + (k % 2 === 0 ? 0.14 : -0.14);
    const cosA = Math.cos(rotA), sinA = Math.sin(rotA);
    for (let i = 0; i < p.count; i++) {
      const u = uv.getX(i), v = uv.getY(i);
      const flare = THREE.MathUtils.smoothstep(v, 0.08, 0.95);
      // 仮根(v<0.08)を一点に寄せつつ上部へ向かって碗状の反りと葉縁のうねりを形成
      const cup = Math.cos((u - 0.5) * Math.PI) * 0.055 * flare;
      const ripple = Math.sin(v * 14.0 + u * 6.0 + k * 1.7) * 0.022 * Math.sin(v * Math.PI);
      const arch = flare * flare * 0.095;
      const twist = (v - 0.12) * (k % 2 === 0 ? 0.34 : -0.30);
      const x0 = p.getX(i) * (0.35 + 0.65 * THREE.MathUtils.smoothstep(v, 0.0, 0.24));
      const z0 = -cup + ripple + arch;
      const ct = Math.cos(twist), st = Math.sin(twist);
      const x1 = x0 * ct - z0 * st;
      const z1 = x0 * st + z0 * ct;
      const y1 = p.getY(i) - flare * flare * 0.024;
      p.setXYZ(i, x1, y1, z1);
      tanArr[i * 3] = cosA;
      tanArr[i * 3 + 1] = 0;
      tanArr[i * 3 + 2] = -sinA;
    }
    sh.rotateY(rotA);
    sh.computeVertexNormals();
    sh.setAttribute('aTan', new THREE.BufferAttribute(tanArr, 3));
    sheets.push(sh);
  }
  const geo = mergeGeometries(sheets);

  const ph = new Float32Array(count);
  const tn = new Float32Array(count);
  const mat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    fog: true,
    alphaToCoverage: true,
    uniforms: {
      ...fogU(), uTime: T, uMap: { value: tex }, uSun: { value: SUN_DIR },
      uSurf: { value: SURF }, uSway: { value: sway }, uBack: { value: new THREE.Color(...warmBack) },
    },
    vertexShader: `attribute float aPhase; attribute float aTint; attribute vec3 aTan;
      uniform float uTime, uSway;
      varying vec2 vUv; varying vec3 vWorld; varying vec3 vN; varying vec3 vT; varying float vH; varying float vTint;
      #include <fog_pars_vertex>
      void main(){
        vUv = uv; vH = uv.y; vTint = aTint;
        vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0);
        float height = length(instanceMatrix[1].xyz);
        float bend = pow(clamp(uv.y, 0.0, 1.0), 1.35);
        // 対馬暖流の空間コヒーレントなうねり波 + 個別の葉先揺動
        float surge = sin(uTime * 0.72 - dot(wp.xz, vec2(0.18, 0.11)) + aPhase * 0.35);
        float gust = sin(uTime * 1.38 + aPhase * 2.1 + uv.y * 3.8 + uv.x * 2.5);
        wp.x += (surge * uSway * 0.95 + uSway * 0.38 + gust * uSway * 0.28) * bend * height;
        wp.z += (cos(uTime * 0.56 - dot(wp.xz, vec2(0.14, 0.16)) + aPhase * 0.4) * uSway * 0.65 + gust * uSway * 0.20) * bend * height;
        wp.y -= abs(surge) * 0.042 * bend * height;
        vWorld = wp.xyz;
        mat3 instN = mat3(modelMatrix) * mat3(instanceMatrix);
        vN = normalize(instN * normal);
        vT = normalize(instN * aTan);
        vec4 mvPosition = viewMatrix * wp;
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `uniform sampler2D uMap; uniform float uTime, uSurf; uniform vec3 uSun, uBack;
      varying vec2 vUv; varying vec3 vWorld; varying vec3 vN; varying vec3 vT; varying float vH; varying float vTint;
      #include <fog_pars_fragment>
      ${CAUSTIC_GLSL}
      ${ABSORB_GLSL}
      void main(){
        vec4 texel = texture2D(uMap, vUv);
        float alpha = smoothstep(0.14, 0.56, texel.a);
        if (alpha < 0.09) discard;

        // 葉面の皺・気胞・葉脈からの微細バンプ法線
        float eps = 0.0020;
        float lumC = dot(texel.rgb, vec3(0.3, 0.59, 0.11));
        float lumX = dot(texture2D(uMap, vUv + vec2(eps, 0.0)).rgb, vec3(0.3, 0.59, 0.11));
        float lumY = dot(texture2D(uMap, vUv + vec2(0.0, eps)).rgb, vec3(0.3, 0.59, 0.11));
        vec3 N0 = normalize(vN);
        if (!gl_FrontFacing) N0 = -N0;
        vec3 T = normalize(vT - N0 * dot(N0, vT));
        vec3 B = normalize(cross(N0, T));
        vec3 n = normalize(N0 + T * ((lumC - lumX) * 1.45) + B * ((lumC - lumY) * 1.45));

        vec3 V = normalize(cameraPosition - vWorld);
        float depthFac = exp(-max(uSurf - vWorld.y, 0.0) * 0.032);
        float holdAO = mix(0.62, 1.0, smoothstep(0.0, 0.14, vH));
        vec3 col = texel.rgb * (0.94 + 0.20 * vTint) * holdAO;

        // 仮根近傍のわずかな石灰・砂粒馴染み
        float holdSed = 1.0 - smoothstep(0.0, 0.08, vH);
        col = mix(col, vec3(0.32, 0.30, 0.26), holdSed * 0.24);

        float diff = clamp(dot(n, uSun), 0.0, 1.0);
        float wrapDiff = clamp(0.32 * dot(n, uSun) + 0.68, 0.32, 1.0);
        float shade = mix(0.64, 1.08, smoothstep(0.0, 0.82, vH));
        vec3 bounce = vec3(0.22, 0.40, 0.36) * max(-n.y, 0.0) * depthFac;
        vec3 lit = col * (vec3(0.38, 0.56, 0.60) * wrapDiff + vec3(0.86, 0.98, 1.0) * diff * 0.64 + bounce) * shade * depthFac;

        // 厚み(茎/主軸=暗く、葉片=クロロフィル透過) に応じた SSS 透過発光
        float bladeThin = smoothstep(0.03, 0.24, lumC) * smoothstep(0.06, 0.55, vH);
        float sunForward = pow(clamp(dot(-V, uSun), 0.0, 1.0), 2.1) * 0.90 + pow(clamp(dot(-n, uSun), 0.0, 1.0), 1.4) * 0.55;
        lit += (col * 1.45 + uBack * 0.85) * (0.22 + sunForward * 0.85) * bladeThin * depthFac;

        // 濡れた藻体表面の光沢 + 色収差コースティクス
        vec3 H = normalize(uSun + V);
        float wetSpec = pow(max(dot(n, H), 0.0), 32.0) * (0.30 + 0.42 * smoothstep(0.06, 0.36, lumC)) * (0.35 + 0.65 * vH) * depthFac;
        lit += vec3(0.58, 0.82, 0.54) * wetSpec;
        vec3 ca = causticRGB(vWorld.xz * 0.065, uTime * 0.50);
        lit += col * ca * (0.32 + 0.48 * max(n.y, 0.0)) * (0.3 + 0.7 * vH) * depthFac;

        lit = absorbWaterScatter(lit, vWorld, cameraPosition, uSun);
        gl_FragColor = vec4(lit, clamp(alpha, 0.0, 1.0));
        #include <fog_fragment>
      }`
  });

  const mesh = new THREE.InstancedMesh(geo, mat, count);
  mesh.frustumCulled = false;
  const d = new THREE.Object3D();
  const up = new THREE.Vector3(0, 1, 0), iq = new THREE.Quaternion(), worldUpQ = new THREE.Quaternion();
  for (let i = 0; i < count; i++) {
    const pl = places[i];
    d.position.set(pl.x, pl.y, pl.z);
    if (pl.nrm) {
      iq.setFromUnitVectors(up, pl.nrm);
      iq.slerp(worldUpQ, 0.65);
      d.quaternion.copy(iq);
      d.rotateY(R(0, 6.28));
    } else {
      d.rotation.set(R(-tiltStrength, tiltStrength), R(0, 6.28), R(-tiltStrength, tiltStrength));
    }
    d.scale.setScalar(pl.h);
    d.updateMatrix();
    mesh.setMatrixAt(i, d.matrix);
    ph[i] = R(0, 6.28);
    tn[i] = rand();
  }
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(ph, 1));
  geo.setAttribute('aTint', new THREE.InstancedBufferAttribute(tn, 1));
  scene.add(mesh);
  return mesh;
}

const guideTargets = [];
const updaters = [];
let cameraZones = null;

async function initWorld() {
  try {
    const [
      profiles, sandDiff, sandNor, sandArm, rockDiff, rockNor, rockArm,
      arameTex, hondawaraTex, starTex, aoriikaTex, sazaeTex, awabiTex, manamakoTex, aoumiushiTex

      loadTex('assets/tex/coast_sand_04_diff.jpg', { srgb: true, repeat: 44 }),
      loadTex('assets/tex/coast_sand_04_nor_gl.jpg', { srgb: false, repeat: 44 }),
      loadTex('assets/tex/coast_sand_04_arm.jpg', { srgb: false, repeat: 44 }),
      loadTex('assets/tex/aerial_rocks_02_diff.jpg', { srgb: true, repeat: 2 }),
      loadTex('assets/tex/aerial_rocks_02_nor_gl.jpg', { srgb: false, repeat: 2 }),
      loadTex('assets/tex/aerial_rocks_02_arm.jpg', { srgb: false, repeat: 2 }),
      loadTex('assets/bio/arame.png', { srgb: true }),
      loadTex('assets/bio/hondawara.png', { srgb: true }),
      loadTex('assets/bio/itomakihitode.png', { srgb: true }),
      loadTex('assets/bio/aoriika.png', { srgb: true }),
      loadTex('assets/bio/sazae.png', { srgb: true }),
      loadTex('assets/bio/awabi.png', { srgb: true }),
      loadTex('assets/bio/manamako.png', { srgb: true }),
      loadTex('assets/bio/aoumiushi.png', { srgb: true }),
    ]);

    const fishNames = ['madai', 'ishidai', 'mejina', 'kasago', 'suzumedai', 'nenbutsudai', 'kyusen', 'maaji', 'hiramasa', 'aigo', 'kawahagi', 'isaki', 'mebaru', 'sorasuzumedai', 'kue', 'kurodai'];
    const fishTex = {};
    await Promise.all(fishNames.map(async n => {
      fishTex[n] = await loadTex(`assets/bio/${n}.png`, { srgb: true });
    }));

    // 1. Seabed terrain (Poly Haven coast_sand_04 PBR)
    const sandMat = new THREE.MeshStandardMaterial({
      map: sandDiff, normalMap: sandNor, normalScale: new THREE.Vector2(1.1, 1.1),
      aoMap: sandArm, roughnessMap: sandArm, roughness: 0.92, metalness: 0.0,
    });
    patchUnderwaterStandardMat(sandMat, { key: 'uw_sand', isRock: false, ripple: true });
    const sandGeo = new THREE.PlaneGeometry(420, 420, 220, 220);
    sandGeo.rotateX(-Math.PI / 2);
    const sp = sandGeo.attributes.position;
    for (let i = 0; i < sp.count; i++) sp.setY(i, floorH(sp.getX(i), sp.getZ(i)));
    sandGeo.computeVertexNormals();
    const sandMesh = new THREE.Mesh(sandGeo, sandMat);
    sandMesh.receiveShadow = true;
    scene.add(sandMesh);

    // 2. Basalt & Reef Outcrops (Poly Haven aerial_rocks_02 PBR + World Triplanar + 5-octave basalt strata)
    const rockMat = new THREE.MeshStandardMaterial({
      map: rockDiff, normalMap: rockNor, normalScale: new THREE.Vector2(1.4, 1.4),
      aoMap: rockArm, roughnessMap: rockArm, roughness: 0.88, metalness: 0.03,
    });
    patchUnderwaterStandardMat(rockMat, { key: 'uw_rock', isRock: true, ripple: false });
    const rawRockGeo = new THREE.IcosahedronGeometry(1, 5);
    rawRockGeo.deleteAttribute('uv');
    const rockGeo = mergeVertices(rawRockGeo, 1e-4);
    const rp = rockGeo.attributes.position;
    const rv = new THREE.Vector3();
    const rockUvs = new Float32Array(rp.count * 2);
    for (let i = 0; i < rp.count; i++) {
      rv.fromBufferAttribute(rp, i).normalize();
      const strata = 0.065 * Math.sin(rv.y * 12.0 + Math.sin(rv.x * 4.5 + rv.z * 3.8) * 1.4);
      const disp = 1
        + 0.20 * Math.sin(rv.x * 3.2 + rv.y * 1.9) * Math.cos(rv.z * 3.1 - rv.y * 1.3)
        + 0.11 * Math.sin(rv.x * 6.8 + rv.z * 5.9 + 0.8)
        + 0.055 * Math.cos(rv.y * 10.5 - rv.x * 6.2 + rv.z * 5.1)
        + 0.028 * Math.sin(rv.x * 16.0 + rv.y * 14.0 - rv.z * 13.0)
        + strata;
      rv.multiplyScalar(disp);
      rp.setXYZ(i, rv.x, rv.y, rv.z);
      rockUvs[i * 2] = 0.5 + rv.x * 0.5;
      rockUvs[i * 2 + 1] = 0.5 + rv.z * 0.5;
    }
    rockGeo.setAttribute('uv', new THREE.BufferAttribute(rockUvs, 2));
    rockGeo.computeVertexNormals();

    const rockSpecs = [];
    const reefRocks = [], kelpRocks = [], isoyakeRocks = [];
    const camAnchors = [[-7.5, -4.0], [2.8, 1.2], [-2.0, 9.2]];
    const nearCamera = (x, z) => camAnchors.some(([cx, cz]) => Math.hypot(x - cx, z - cz) < 3.2);
    const pickRockXZ = (cx, cz, rMin, rMax) => {
      for (let t = 0; t < 30; t++) {
        const a = R(0, 6.28), r = R(rMin, rMax);
        const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
        if (!nearCamera(x, z)) return [x, z];
      }
      return [cx + R(1.5, 4.0), cz + R(1.5, 4.0)];
    };

    // Zone 2 沈み瀬の切り立つ岩礁 (+15, -4)
    for (let i = 0; i < 18; i++) {
      const [x, z] = pickRockXZ(15, -4, 0, 8.5);
      const sx = R(1.8, 3.6), sy = R(1.7, 4.0), sz = R(1.6, 3.4);
      const rk = { x, y: floorH(x, z) + sy * 0.20, z, sx, sy, sz };
      rockSpecs.push(rk); reefRocks.push(rk);
    }
    // Zone 1 藻場の平岩盤 (-14, -10)
    for (let i = 0; i < 18; i++) {
      const [x, z] = pickRockXZ(-14, -10, 0, 11.5);
      const sx = R(1.6, 3.5), sy = R(0.6, 1.4), sz = R(1.5, 3.2);
      const rk = { x, y: floorH(x, z) - sy * 0.22, z, sx, sy, sz };
      rockSpecs.push(rk); kelpRocks.push(rk);
    }
    // Zone 3 磯焼けの岩盤 (-2, +18)
    for (let i = 0; i < 16; i++) {
      const [x, z] = pickRockXZ(-2, 18, 0, 10.0);
      const sx = R(1.5, 3.2), sy = R(0.65, 1.5), sz = R(1.4, 3.0);
      const rk = { x, y: floorH(x, z) - sy * 0.16, z, sx, sy, sz };
      rockSpecs.push(rk); isoyakeRocks.push(rk);
    }
    // 周縁の点在岩礁
    for (let i = 0; i < 36; i++) {
      const a = R(0, 6.28), r = R(24, 65);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const s = R(1.6, 5.2);
      rockSpecs.push({ x, y: floorH(x, z) - s * 0.25, z, sx: s * R(0.9, 1.5), sy: s * R(0.5, 1.1), sz: s * R(0.9, 1.4) });
    }
    const rocks = new THREE.InstancedMesh(rockGeo, rockMat, rockSpecs.length);
    rocks.castShadow = true;
    rocks.receiveShadow = true;
    for (let i = 0; i < rockSpecs.length; i++) {
      const rk = rockSpecs[i];
      dummy.position.set(rk.x, rk.y, rk.z);
      dummy.rotation.set(R(-0.2, 0.2), R(0, 6.28), R(-0.2, 0.2));
      dummy.scale.set(rk.sx, rk.sy, rk.sz);
      dummy.updateMatrix();
      rocks.setMatrixAt(i, dummy.matrix);
    }
    rocks.instanceMatrix.needsUpdate = true;
    rocks.updateMatrixWorld(true);
    sandMesh.updateMatrixWorld(true);
    scene.add(rocks);

    // 岩礁上面＋砂地の正確な地表高さ・法線サンプラー (Raycaster)
    const rc = new THREE.Raycaster();
    const rcOrig = new THREE.Vector3();
    const rcDown = new THREE.Vector3(0, -1, 0);
    const surfaceMeshes = [rocks, sandMesh];
    function rayHeight(x, z) {
      rcOrig.set(x, 30, z);
      rc.set(rcOrig, rcDown);
      const hits = rc.intersectObjects(surfaceMeshes, false);
      return hits.length ? hits[0].point.y : floorH(x, z);
    }
    function surfaceAt(x, z, outPos, outNrm) {
      const y = rayHeight(x, z);
      outPos.set(x, y, z);
      if (outNrm) {
        const e = 0.14;
        const hx = rayHeight(x + e, z) - y;
        const hz = rayHeight(x, z + e) - y;
        outNrm.set(-hx, e, -hz).normalize();
      }
    }

// ---------------------------------------------------------------- camera look & mode switching
let mode = 'auto';
let yaw = 0.72, pitch = 0.04, tYaw = yaw, tPitch = pitch;
let dragging = false, lastX = 0, lastY = 0, lastInteract = -100;
const cvs = renderer.domElement;

cvs.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cvs.setPointerCapture(e.pointerId); lastInteract = T.value;
});
cvs.addEventListener('pointermove', e => {
  if (!dragging) return;
  tYaw += (e.clientX - lastX) * 0.0035;
  tPitch = THREE.MathUtils.clamp(tPitch + (e.clientY - lastY) * 0.0035, -1.15, 1.32);
  lastX = e.clientX; lastY = e.clientY; lastInteract = T.value;
});
const endDrag = () => { dragging = false; };
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);

const zoneTargetYaw = { auto: 0.72, kelp: 0.78, reef: -1.17, isoyake: 3.14 };

  kelp: '🌿 藻場（アラメ・クロメ場とホンダワラ類のガラモ場）— 二層の海中林がアオリイカの産卵床となり、稚魚やサザエ・アワビを育む「海のゆりかご」',

  isoyake: '🟣 磯焼け（無節サンゴモ平原）— 高水温化とアイゴ・ムラサキウニ等の食害で大型海藻が消失し、白〜淡桃色の石灰藻が岩肌を覆う海域',
};
const zoneInfoEl = document.getElementById('zoneInfo');
document.querySelectorAll('button[data-mode]').forEach(btn => {
  btn.onclick = () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('button[data-mode]').forEach(b => b.classList.toggle('active', b === btn));

  guideOn = !guideOn;
  guideBtn.classList.toggle('active', guideOn);
  guideLayer.classList.toggle('on', guideOn);
};

document.getElementById('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};

// Web Audio: 対馬暖流の水中低音・気泡・岩礁のテッポウエビ音
let audio = null;
function createAudio() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
  const len = ctx.sampleRate * 8, buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch); let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.4; }
  }
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 340; lp.Q.value = 0.85;
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.065;
  const lfoG = ctx.createGain(); lfoG.gain.value = 130; lfo.connect(lfoG).connect(lp.frequency);
  src.connect(lp).connect(master); src.start(); lfo.start();

  const blip = () => {
    const now = ctx.currentTime, n = Math.random() < 0.3 ? Math.floor(R(2, 6)) : 1;
    for (let i = 0; i < n; i++) {
      const t0 = now + i * R(0.05, 0.16), f = R(320, 980);
      const o = ctx.createOscillator(), g = ctx.createGain(), pan = ctx.createStereoPanner();
      o.type = 'sine'; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f * R(1.7, 2.8), t0 + 0.07);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(R(0.008, 0.028), t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
      pan.pan.value = R(-0.8, 0.8);
      o.connect(g).connect(pan).connect(master); o.start(t0); o.stop(t0 + 0.16);
    }
    setTimeout(blip, R(700, 3800));
  };
  blip();
  return { ctx, master };
}
const soundBtn = document.getElementById('soundBtn');
let soundOn = false;
soundBtn.onclick = async () => {
  if (!audio) audio = createAudio();
  soundOn = !soundOn;
  const { ctx, master } = audio;
  if (soundOn) await ctx.resume();
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
  master.gain.linearRampToValueAtTime(soundOn ? 0.58 : 0, ctx.currentTime + 1.4);
  soundBtn.textContent = soundOn ? '🔊 サウンド' : '🔇 サウンド';
  soundBtn.classList.toggle('active', soundOn);
};

// ---------------------------------------------------------------- guide labels updater
const tagPool = [];
const gPos = new THREE.Vector3(), gProj = new THREE.Vector3();
function updateGuideLabels() {
  if (!guideOn || !guideTargets.length) return;
  while (tagPool.length < 7) {
    const el = document.createElement('div');
    el.className = 'tag';
    el.innerHTML = '<b></b><span></span>';
    guideLayer.appendChild(el);
    tagPool.push(el);
  }
  const cand = [];
  for (const gt of guideTargets) {
    gt.getPos(gPos);
    const dist = gPos.distanceTo(camera.position);
    if (dist > 25 || dist < 1.2) continue;
    gProj.copy(gPos).project(camera);
    if (gProj.z < -1 || gProj.z > 1) continue;
    const sx = (gProj.x * 0.5 + 0.5) * innerWidth;
    const sy = (-gProj.y * 0.5 + 0.5) * innerHeight;
    if (sx < 70 || sx > innerWidth - 70 || sy < 50 || sy > innerHeight - 90) continue;
    cand.push({ gt, dist, sx, sy });
  }
  cand.sort((a, b) => a.dist - b.dist);
  const placed = [];
  for (const c of cand) {
    if (placed.some(p => Math.abs(p.sx - c.sx) < 135 && Math.abs(p.sy - c.sy) < 48)) continue;
    placed.push(c);
    if (placed.length >= 7) break;
  }
  for (let i = 0; i < tagPool.length; i++) {
    const el = tagPool[i];
    if (i < placed.length) {
      const p = placed[i];
      el.style.display = 'block';
      el.style.left = `${p.sx}px`;
      el.style.top = `${p.sy - 14}px`;
      el.style.opacity = String(THREE.MathUtils.clamp(1.2 - p.dist / 24, 0.4, 0.95));
      el.firstElementChild.textContent = p.gt.name;
      el.lastElementChild.textContent = p.gt.desc;
    } else {
      el.style.display = 'none';
    }
  }
}

// ---------------------------------------------------------------- loop & resize
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
  underwaterLensPass.uniforms.uRes.value.set(innerWidth, innerHeight);
  updatePointScale();
}
addEventListener('resize', onResize);
onResize();

const clock = new THREE.Clock();
const camTarget = new THREE.Vector3(-4, floorH(-4, 0) + 3.2, 0);
camera.position.copy(camTarget);
const sunProj = new THREE.Vector3();
const camFwd = new THREE.Vector3();

initWorld();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = (T.value += dt);

  if (cameraZones) {
    cameraZones[mode](t, camTarget);
    camera.position.lerp(camTarget, 1 - Math.exp(-dt * (mode === 'auto' ? 1.3 : 2.2)));
  }

  if (t - lastInteract > 8 && !dragging) {
    if (mode === 'auto') {
      tYaw += dt * 0.022;
      tPitch += (0.04 - tPitch) * dt * 0.15;
    } else {
      tYaw += Math.sin(t * 0.15) * dt * 0.012;
    }
  }
  const k = 1 - Math.exp(-dt * 4);
  yaw += (tYaw - yaw) * k;
  pitch += (tPitch - pitch) * k;
  camera.rotation.set(
    pitch + Math.sin(t * 0.21) * 0.014,
    yaw + Math.sin(t * 0.13) * 0.018,
    Math.sin(t * 0.28) * 0.01
  );

  // スクリーンスペース太陽シャフト用の太陽スクリーン座標と可視度更新
  camera.getWorldDirection(camFwd);
  const sunAlign = camFwd.dot(SUN_DIR);
  sunProj.copy(camera.position).addScaledVector(SUN_DIR, 100).project(camera);
  underwaterLensPass.uniforms.uSunScreen.value.set(sunProj.x * 0.5 + 0.5, sunProj.y * 0.5 + 0.5);
  underwaterLensPass.uniforms.uSunVis.value = THREE.MathUtils.clamp((sunAlign - 0.12) / 0.65, 0, 1);

  for (const r of rays) {
    r.rotation.y = Math.atan2(camera.position.x - r.position.x, camera.position.z - r.position.z);
  }
  for (const fn of updaters) fn(t);
  updateGuideLabels();

  composer.render();
});
</script>
